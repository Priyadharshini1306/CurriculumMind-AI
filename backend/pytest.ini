[pytest]
testpaths = tests
# Default run = fast offline unit tests. Opt in to the rest:
#   pytest -m integration     live MongoDB / Neo4j / Groq / web
#   pytest -m e2e             full pipeline (real databases, stubbed LLM + web)
addopts = -m "not integration and not e2e" -p no:cacheprovider
markers =
    integration: needs live services (MongoDB Atlas, Neo4j AuraDB, Groq, internet)
    e2e: full pipeline through the HTTP API against the real databases
filterwarnings =
    ignore::DeprecationWarning
    ignore::jwt.warnings.InsecureKeyLengthWarning
